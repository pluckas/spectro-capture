<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spectro Capture · Batch Monitor</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <aside>
    <strong>Spectro Capture</strong>
    <nav aria-label="Observatory sections">
      <a href="#batch" aria-current="page">Batch Runner</a>
      <span>Sequencer</span><span>Targets</span><span>Telescope</span>
      <span>Guiding</span><span>Focus</span><span>Calibration</span><span>Setup</span>
    </nav>
  </aside>
  <main id="batch">
    <header>
      <h1>Batch Runner</h1>
      <p id="connection" role="status">Connecting to Spectro Capture…</p>
    </header>
    <dl id="hardware" aria-label="Observatory status"></dl>
    <section class="activity" aria-labelledby="activity">
      <p id="mode"></p>
      <h2 id="activity">Waiting for status</h2>
      <p id="exposure" hidden></p>
      <progress id="progress" aria-label="Current exposure" hidden></progress>
    </section>
    <section aria-labelledby="targets">
      <h2 id="targets">Targets</h2>
      <div class="table-scroll" tabindex="0" role="region" aria-label="Batch target table">
        <table>
          <thead><tr><th>Target</th><th>Start (UT)</th><th>Exposure</th><th>Frames</th>
            <th>Calibration</th><th>Reference</th><th>Status</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
    <section aria-labelledby="recent">
      <h2 id="recent">Recent activity</h2>
      <ol id="events"></ol>
    </section>
  </main>
</body>
</html>
