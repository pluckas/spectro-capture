<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spectro Capture · Batch Monitor</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <aside>
    <strong>Spectro Capture</strong>
    <nav aria-label="Observatory sections">
      <a href="#batch" aria-current="page">Batch Runner</a>
      <span>Sequencer</span><span>Targets</span><span>Telescope</span>
      <span>Guiding</span><span>Focus</span><span>Calibration</span><span>Setup</span>
    </nav>
  </aside>
  <main id="batch">
    <header>
      <h1>Batch Runner</h1>
      <p id="connection" role="status">Connecting to Spectro Capture…</p>
    </header>
    <dl id="hardware" aria-label="Observatory status">
      <div>
        <dt>
          <span id="camera-label">Camera</span>
          <button id="camera-toggle" class="hardware-toggle" type="button" aria-controls="camera-panel" aria-expanded="false" hidden>Camera</button>
        </dt>
        <dd id="camera-state">—</dd>
      </div>
      <div>
        <dt><span id="telescope-label">Telescope</span><button id="telescope-toggle" class="hardware-toggle" type="button" aria-controls="telescope-panel" aria-expanded="false" hidden>Telescope</button></dt>
        <dd id="telescope-state">—</dd>
      </div>
      <div>
        <dt><span id="dome-label">Dome</span><button id="dome-toggle" class="hardware-toggle" type="button" aria-controls="dome-panel" aria-expanded="false" hidden>Dome</button></dt>
        <dd id="dome-state">—</dd>
      </div>
    </dl>
    <section id="camera-panel" class="hardware-panel" aria-label="Camera controls" hidden>
      <button id="camera-connection" type="button" disabled>Connect</button>
      <form id="camera-temperature" hidden>
        <label>Setpoint (°C) <input id="camera-setpoint" type="number" step="any" required></label>
        <button id="camera-apply" type="submit">Apply</button>
        <button id="camera-cooler-on" type="button" disabled>Cooler On</button>
        <button id="camera-cooler-off" type="button" disabled>Cooler Off</button>
      </form>
      <label>Binning
        <select id="camera-binning" disabled>
          <option value="" disabled>—</option>
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        </select>
      </label>
      <p id="camera-result" role="status"></p>
    </section>
    <section id="telescope-panel" class="hardware-panel" aria-label="Telescope controls" hidden>
      <button id="telescope-connection" type="button" disabled>Connect</button>
      <p id="telescope-result" role="status"></p>
    </section>
    <section id="dome-panel" class="hardware-panel" aria-label="Dome controls" hidden>
      <button id="dome-connection" type="button" disabled>Connect</button>
      <div id="dome-operations" hidden>
        <p id="dome-detail"></p>
        <div class="dome-actions">
          <button type="button" data-action="open">Open Shutter</button>
          <button type="button" data-action="close">Close Shutter</button>
          <button type="button" data-action="park">Park</button>
          <button type="button" data-action="home">Home</button>
          <button type="button" data-action="abort">Abort</button>
          <button id="dome-sync" type="button">Enable Sync</button>
        </div>
      </div>
      <p id="dome-result" role="status"></p>
    </section>
    <section class="activity" aria-labelledby="activity">
      <p id="mode"></p>
      <h2 id="activity">Waiting for status</h2>
      <p id="exposure" hidden></p>
      <progress id="progress" aria-label="Current exposure" hidden></progress>
      <div id="batch-commands" class="batch-commands" hidden>
        <button id="batch-run" type="button" disabled>Run</button>
        <button id="batch-stop" type="button" disabled>Stop</button>
        <span id="batch-target-count"></span>
        <p id="batch-result" role="status"></p>
      </div>
    </section>
    <section aria-labelledby="targets">
      <h2 id="targets">Targets</h2>
      <div class="table-scroll" tabindex="0" role="region" aria-label="Batch target table">
        <table>
          <thead><tr><th>Target</th><th>Start (UT)</th><th>Exposure</th><th>Frames</th>
            <th>Calibration</th><th>Reference</th><th>Status</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
    <section aria-labelledby="recent">
      <h2 id="recent">Recent activity</h2>
      <ol id="events"></ol>
    </section>
  </main>
</body>
</html>
